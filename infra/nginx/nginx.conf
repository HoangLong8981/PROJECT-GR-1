worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Định dạng log chi tiết phục vụ kiểm chứng độ trễ và node xử lý (upstream_addr)
    log_format well_architected '$remote_addr - [$time_local] "$request" '
                                'status=$status body_bytes=$body_bytes_sent '
                                'rt=$request_time uct="$upstream_connect_time" '
                                'urt="$upstream_response_time" '
                                'upstream="$upstream_addr"';

    access_log /var/log/nginx/access.log well_architected;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # =========================================================================
    # CỤM MÁY CHỦ ỨNG DỤNG PHÍA SAU (UPSTREAM POOL - MULTI-REPLICA)
    # Sử dụng thuật toán least_conn và cơ chế kiểm tra lỗi nhanh (Failover)
    # =========================================================================
    upstream ecommerce_backend {
        least_conn;
        server app-replica-1:8000 max_fails=1 fail_timeout=2s;
        server app-replica-2:8000 max_fails=1 fail_timeout=2s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Endpoint kiểm tra trạng thái của chính Load Balancer
        location /lb-status {
            access_log off;
            return 200 '{"lb":"healthy","architecture":"V2-Well-Architected"}\n';
            add_header Content-Type application/json;
        }

        location / {
            proxy_pass http://ecommerce_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Thiết lập Timeout ngắn để phát hiện nút chết tức thì (Giảm RTO < 2 giây)
            proxy_connect_timeout 1s;
            proxy_send_timeout    3s;
            proxy_read_timeout    3s;

            # Tự động chuyển tiếp request sang bản sao còn sống nếu bản sao hiện tại lỗi
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # Thêm Header minh chứng Load Balancer đã điều hướng vào bản sao nào
            add_header X-Upstream-Node $upstream_addr always;
            add_header X-Arch-Tier "Nginx-L7-LoadBalancer" always;
        }
    }
}
